[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-coding-agent"
version = "0.1.0"
description = "Codex/Claude Code 수준의 자율 코딩 에이전트 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Steve", email = "steve@mini.local"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "ghapi>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1",
    "pytest-html>=4.1",
    "pip-audit>=2.7",
    "safety>=3.0",
    "bandit>=1.7",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
]

[project.urls]
Homepage = "https://github.com/stevemini8585/autonomous-coding-agent"
Repository = "https://github.com/stevemini8585/autonomous-coding-agent"
Issues = "https://github.com/stevemini8585/autonomous-coding-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autonomous_coding_agent*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "PTH", "ERA", "PL", "TRY"
]
ignore = [
    "E501", "TRY003", "PTH118", "PTH123",
    "PLR0913", "PLR0917", "PLR0911", "PLR0912", "PLR0915",
    "PLC0415", "PLR2004", "TRY400", "TRY300",
    "SIM102", "SIM103", "B007", "PLW2901",
    "F841", "F821", "ERA001", "PLW1510",
    "UP035", "UP045", "UP006", "UP017",
    "B905", "E741", "W293", "W292",
    "PLW0603", "F401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \\.git
  | \\.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
implicit_reexport = true
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/autonomous_coding_agent"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
