<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Coding Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bg-dark { background-color: #0d1117; }
        .bg-card { background-color: #161b22; }
        .border-subtle { border-color: #30363d; }
        .text-muted { color: #8b949e; }
        .text-accent { color: #58a6ff; }
        .text-success { color: #3fb950; }
        .text-warning { color: #d29922; }
        .text-error { color: #f85149; }
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring-bg { stroke: #30363d; }
        .progress-ring-fg { stroke: #58a6ff; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
        .log-entry { animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .step-card { transition: all 0.3s ease; }
        .step-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-dark text-gray-100 min-h-screen">
    <div id="app">
        <!-- Header -->
        <header class="bg-card border-b border-subtle sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">Autonomous Coding Agent</h1>
                        <p class="text-xs text-muted">Real-time Pipeline Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-800">
                        <span id="ws-status" class="w-2 h-2 rounded-full bg-error"></span>
                        <span id="ws-status-text" class="text-sm text-muted">Disconnected</span>
                    </div>
                    <button onclick="refreshSessions()" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-sm font-medium transition-colors">
                        Refresh
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6">
            <!-- Sessions List -->
            <section id="sessions-view" class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold">Active Sessions</h2>
                    <div class="flex items-center gap-2">
                        <select id="session-filter" class="px-3 py-1.5 rounded-lg bg-card border border-subtle text-sm">
                            <option value="all">All Sessions</option>
                            <option value="running">Running</option>
                            <option value="completed">Completed</option>
                            <option value="failed">Failed</option>
                        </select>
                    </div>
                </div>
                <div id="sessions-grid" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                    <!-- Sessions will be rendered here -->
                </div>
            </section>

            <!-- Autopilot Runs -->
            <section id="autopilot-view" class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold">🤖 Autopilot Runs</h2>
                    <span id="autopilot-count" class="text-xs text-muted"></span>
                </div>
                <div class="bg-card rounded-xl border border-subtle overflow-hidden">
                    <div id="autopilot-list" class="divide-y divide-subtle">
                        <p class="px-4 py-6 text-muted text-center text-sm">아직 처리된 이슈가 없습니다</p>
                    </div>
                </div>
            </section>

            <!-- Session Detail View (Hidden by default) -->
            <section id="detail-view" class="hidden">
                <div class="mb-4 flex items-center justify-between">
                    <button onclick="showSessionsView()" class="flex items-center gap-2 text-muted hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        <span>Back to Sessions</span>
                    </button>
                    <div class="flex items-center gap-4">
                        <span id="detail-session-status" class="px-3 py-1 rounded-full text-xs font-medium"></span>
                        <span id="detail-session-progress" class="text-sm font-mono text-accent"></span>
                    </div>
                </div>
                <div class="grid gap-6 lg:grid-cols-3">
                    <!-- Left: Progress Overview -->
                    <div class="lg:col-span-1 space-y-6">
                        <div class="bg-card rounded-xl border border-subtle p-6">
                            <h3 class="font-semibold mb-4">Overall Progress</h3>
                            <div class="relative w-48 h-48 mx-auto">
                                <svg class="w-full h-full progress-ring">
                                    <circle class="progress-ring-bg" cx="96" cy="96" r="80" fill="none" stroke-width="12"></circle>
                                    <circle id="progress-ring" class="progress-ring-fg" cx="96" cy="96" r="80" fill="none" stroke-width="12" stroke-dasharray="502.65" stroke-dashoffset="502.65"></circle>
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center">
                                    <span id="overall-percent" class="text-4xl font-bold font-mono">0%</span>
                                    <span class="text-xs text-muted">Complete</span>
                                </div>
                            </div>
                            <div class="mt-4 grid grid-cols-3 gap-2 text-center">
                                <div class="bg-gray-800 rounded-lg p-3">
                                    <div id="steps-completed" class="text-2xl font-bold font-mono text-success">0</div>
                                    <div class="text-xs text-muted">Completed</div>
                                </div>
                                <div class="bg-gray-800 rounded-lg p-3">
                                    <div id="steps-total" class="text-2xl font-bold font-mono text-accent">0</div>
                                    <div class="text-xs text-muted">Total Steps</div>
                                </div>
                                <div class="bg-gray-800 rounded-lg p-3">
                                    <div id="steps-current" class="text-2xl font-bold font-mono text-warning">0</div>
                                    <div class="text-xs text-muted">Current</div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-card rounded-xl border border-subtle p-6">
                            <h3 class="font-semibold mb-4">Session Metrics</h3>
                            <div id="session-metrics" class="space-y-3 text-sm">
                                <!-- Metrics rendered here -->
                            </div>
                        </div>
                    </div>

                    <!-- Right: Steps & Logs -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-card rounded-xl border border-subtle overflow-hidden">
                            <div class="px-4 py-3 border-b border-subtle flex items-center justify-between">
                                <h3 class="font-semibold">Pipeline Steps</h3>
                                <div class="flex items-center gap-2">
                                    <button onclick="toggleAllLogs()" class="px-3 py-1 text-xs rounded bg-gray-800 hover:bg-gray-700 transition-colors">
                                        Toggle All Logs
                                    </button>
                                </div>
                            </div>
                            <div id="steps-list" class="divide-y divide-subtle">
                                <!-- Steps rendered here -->
                            </div>
                        </div>

                        <div class="bg-card rounded-xl border border-subtle overflow-hidden">
                            <div class="px-4 py-3 border-b border-subtle flex items-center justify-between">
                                <h3 class="font-semibold">Live Logs</h3>
                                <div class="flex items-center gap-2">
                                    <label class="flex items-center gap-2 text-sm">
                                        <input type="checkbox" id="auto-scroll" checked class="rounded border-subtle">
                                        Auto-scroll
                                    </label>
                                    <button onclick="clearLogs()" class="px-3 py-1 text-xs rounded bg-gray-800 hover:bg-gray-700 transition-colors">
                                        Clear
                                    </button>
                                </div>
                            </div>
                            <div id="logs-container" class="p-4 max-h-96 overflow-y-auto font-mono text-sm space-y-1">
                                <!-- Logs rendered here -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // State
        let ws = null;
        let currentSessionId = null;
        let sessions = {};
        let autoScroll = true;

        // DOM Elements
        const sessionsView = document.getElementById('sessions-view');
        const detailView = document.getElementById('detail-view');
        const sessionsGrid = document.getElementById('sessions-grid');
        const stepsList = document.getElementById('steps-list');
        const logsContainer = document.getElementById('logs-container');
        const progressRing = document.getElementById('progress-ring');
        const overallPercent = document.getElementById('overall-percent');
        const wsStatus = document.getElementById('ws-status');
        const wsStatusText = document.getElementById('ws-status-text');

        // Progress ring constants
        const RING_RADIUS = 80;
        const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
        progressRing.style.strokeDasharray = RING_CIRCUMFERENCE;

        // Connect WebSocket
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                wsStatus.classList.remove('bg-error', 'bg-warning');
                wsStatus.classList.add('bg-success');
                wsStatusText.textContent = 'Connected';
            };

            ws.onclose = () => {
                wsStatus.classList.remove('bg-success', 'bg-warning');
                wsStatus.classList.add('bg-error');
                wsStatusText.textContent = 'Disconnected - Reconnecting...';
                setTimeout(connectWS, 3000);
            };

            ws.onerror = () => {
                wsStatus.classList.remove('bg-success');
                wsStatus.classList.add('bg-warning');
                wsStatusText.textContent = 'Connection Error';
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleWSMessage(msg);
            };
        }

        function handleWSMessage(msg) {
            if (msg.type === 'session_update' && msg.session_id === currentSessionId) {
                updateProgressDisplay(msg.data);
            } else if (msg.type === 'session_started') {
                refreshSessions();
            } else if (msg.type === 'autopilot_update') {
                refreshAutopilot();
            }
        }

        function updateProgressDisplay(data) {
            // Update progress ring
            const progress = data.overall_progress || 0;
            const offset = RING_CIRCUMFERENCE * (1 - progress);
            progressRing.style.strokeDashoffset = offset;
            overallPercent.textContent = Math.round(progress * 100) + '%';

            // Update stats
            document.getElementById('steps-completed').textContent = data.current_step || 0;
            document.getElementById('steps-total').textContent = data.total_steps || 0;

            // Update status badge
            const statusEl = document.getElementById('detail-session-status');
            statusEl.textContent = data.status;
            statusEl.className = 'px-3 py-1 rounded-full text-xs font-medium ' +
                (data.status === 'running' ? 'bg-blue-600' :
                 data.status === 'completed' ? 'bg-green-600' :
                 data.status === 'failed' ? 'bg-red-600' : 'bg-gray-600');
        }

        async function refreshSessions() {
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                sessions = {};
                data.sessions.forEach(s => sessions[s.session_id] = s);
                renderSessions();
            } catch (e) {
                console.error('Failed to fetch sessions:', e);
            }
        }

        async function refreshAutopilot() {
            try {
                const res = await fetch('/api/autopilot');
                const data = await res.json();
                renderAutopilot(data.runs || []);
            } catch (e) {
                console.error('Failed to fetch autopilot runs:', e);
            }
        }

        function stageBadge(stage) {
            const color = stage === 'merged' ? 'text-success' :
                          stage === 'failed' ? 'text-error' :
                          stage === 'skipped' ? 'text-muted' :
                          stage === 'planned' || stage === 'pr_opened' ? 'text-accent' : 'text-warning';
            return `<span class="px-2 py-0.5 rounded text-xs font-medium ${color.replace('text-', 'bg-')}/20 ${color}">${escapeHtml(stage)}</span>`;
        }

        function renderAutopilot(runs) {
            const list = document.getElementById('autopilot-list');
            const count = document.getElementById('autopilot-count');
            const merged = runs.filter(r => r.merged).length;
            count.textContent = `머지 ${merged} / 전체 ${runs.length}`;
            if (runs.length === 0) {
                list.innerHTML = '<p class="px-4 py-6 text-muted text-center text-sm">아직 처리된 이슈가 없습니다</p>';
                return;
            }
            list.innerHTML = '';
            runs.forEach(run => {
                const row = document.createElement('div');
                row.className = 'px-4 py-3 flex items-center justify-between gap-4';
                const detail = [run.gate_summary, run.review_summary].filter(Boolean).join(' · ');
                row.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        <span class="font-mono text-accent font-semibold">#${run.issue_number}</span>
                        ${stageBadge(run.stage)}
                        ${run.pr_number ? `<a href="${escapeHtml(run.pr_url || '#')}" target="_blank" class="text-xs text-accent hover:underline">PR #${run.pr_number}</a>` : ''}
                        ${run.merged ? '<span class="text-xs text-success font-medium">✅ merged</span>' : ''}
                    </div>
                    <div class="text-xs text-muted truncate text-right" title="${escapeHtml(run.error || detail)}">${escapeHtml(run.error || detail)}</div>
                `;
                list.appendChild(row);
            });
        }

        function renderSessions() {
            const filter = document.getElementById('session-filter').value;
            sessionsGrid.innerHTML = '';

            Object.values(sessions)
                .filter(s => filter === 'all' || s.status === filter)
                .sort((a, b) => b.start_time - a.start_time)
                .forEach(session => {
                    const card = document.createElement('div');
                    card.className = 'step-card bg-card rounded-xl border border-subtle p-5 hover:border-blue-500 transition-colors';
                    card.onclick = () => showSessionDetail(session.session_id);

                    const statusColor = session.status === 'running' ? 'text-warning' :
                                       session.status === 'completed' ? 'text-success' :
                                       session.status === 'failed' ? 'text-error' : 'text-muted';

                    card.innerHTML = `
                        <div class="flex items-start justify-between mb-3">
                            <h3 class="font-semibold truncate">${escapeHtml(session.goal)}</h3>
                            <span class="px-2 py-0.5 rounded text-xs font-medium ${statusColor.replace('text-', 'bg-')}/20">${session.status}</span>
                        </div>
                        <div class="flex items-center gap-4 text-sm text-muted mb-3">
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2v10a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h2"/></svg>
                                ${session.current_step}/${session.total_steps}
                            </span>
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                ${Math.round(session.progress * 100)}%
                            </span>
                        </div>
                        <div class="h-2 bg-gray-800 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-blue-500 to-purple-600 transition-all duration-500" style="width: ${session.progress * 100}%"></div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-subtle flex items-center justify-between text-xs text-muted">
                            <span>${formatTime(session.start_time)}</span>
                            <span>${session.end_time ? formatTime(session.end_time) : 'Running...'}</span>
                        </div>
                    `;
                    sessionsGrid.appendChild(card);
                });
        }

        async function showSessionDetail(sessionId) {
            currentSessionId = sessionId;
            try {
                const res = await fetch(`/api/sessions/${sessionId}`);
                const session = await res.json();
                if (session.error) return;

                renderSessionDetail(session);
                sessionsView.classList.add('hidden');
                detailView.classList.remove('hidden');
            } catch (e) {
                console.error('Failed to fetch session:', e);
            }
        }

        function showSessionsView() {
            currentSessionId = null;
            detailView.classList.add('hidden');
            sessionsView.classList.remove('hidden');
        }

        function renderSessionDetail(session) {
            // Update header
            document.getElementById('detail-session-status').textContent = session.status;
            document.getElementById('detail-session-status').className = 'px-3 py-1 rounded-full text-xs font-medium ' +
                (session.status === 'running' ? 'bg-blue-600' :
                 session.status === 'completed' ? 'bg-green-600' :
                 session.status === 'failed' ? 'bg-red-600' : 'bg-gray-600');
            document.getElementById('detail-session-progress').textContent = `${Math.round(session.overall_progress * 100)}% Complete`;

            // Update progress ring
            const progress = session.overall_progress || 0;
            const offset = RING_CIRCUMFERENCE * (1 - progress);
            progressRing.style.strokeDashoffset = offset;
            overallPercent.textContent = Math.round(progress * 100) + '%';

            document.getElementById('steps-completed').textContent = session.current_step;
            document.getElementById('steps-total').textContent = session.total_steps;
            document.getElementById('steps-current').textContent = Object.keys(session.steps).length;

            // Render steps
            stepsList.innerHTML = '';
            Object.values(session.steps).forEach(step => {
                const stepEl = document.createElement('div');
                stepEl.className = 'px-4 py-4 hover:bg-gray-800/50 transition-colors';
                const statusColor = step.status === 'running' ? 'text-warning' :
                                   step.status === 'completed' ? 'text-success' :
                                   step.status === 'failed' ? 'text-error' : 'text-muted';
                const statusBg = statusColor.replace('text-', 'bg-') + '/20';

                stepEl.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full ${statusBg} flex items-center justify-center flex-shrink-0">
                                <svg class="w-5 h-5 ${statusColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    ${step.status === 'running' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>' :
                                      step.status === 'completed' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>' :
                                      step.status === 'failed' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>' :
                                      '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>' }
                                </svg>
                            </div>
                            <div>
                                <div class="font-medium">${escapeHtml(step.title)}</div>
                                <div class="text-xs text-muted">${step.step_id}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="px-2 py-0.5 rounded text-xs font-medium ${statusBg}">${step.status}</span>
                            <div class="w-32 h-2 bg-gray-800 rounded-full overflow-hidden mr-4">
                                <div class="h-full bg-gradient-to-r from-blue-500 to-purple-600" style="width: ${step.progress * 100}%"></div>
                            </div>
                            <span class="text-sm font-mono text-accent w-12 text-right">${Math.round(step.progress * 100)}%</span>
                        </div>
                    </div>
                    ${step.logs && step.logs.length > 0 ? `
                        <div class="mt-3 pt-3 border-t border-subtle" style="display: none;" class="step-logs">
                            <div class="font-mono text-xs text-muted space-y-1 max-h-32 overflow-y-auto">
                                ${step.logs.slice(-20).map(l => `<div>${escapeHtml(l)}</div>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;
                stepsList.appendChild(stepEl);
            });

            // Render metrics
            const metricsEl = document.getElementById('session-metrics');
            metricsEl.innerHTML = '';
            if (session.metrics && Object.keys(session.metrics).length > 0) {
                Object.entries(session.metrics).forEach(([key, value]) => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between py-2 border-b border-subtle/50';
                    div.innerHTML = `<span class="text-muted">${escapeHtml(key)}</span><span class="font-mono">${escapeHtml(String(value))}</span>`;
                    metricsEl.appendChild(div);
                });
            } else {
                metricsEl.innerHTML = '<p class="text-muted text-center py-4">No metrics available</p>';
            }

            // Initial logs
            renderLogs(session);
        }

        function renderLogs(session) {
            logsContainer.innerHTML = '';
            const allLogs = [];
            Object.values(session.steps).forEach(step => {
                if (step.logs) {
                    step.logs.forEach(log => {
                        allLogs.push({ ...log, step: step.title, stepId: step.step_id });
                    });
                }
            });
            allLogs.sort((a, b) => a.timestamp - b.timestamp);
            allLogs.slice(-200).forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-entry text-xs text-gray-400';
                div.innerHTML = `<span class="text-muted">[${log.stepId}]</span> <span class="text-gray-300">${escapeHtml(log.message)}</span>`;
                logsContainer.appendChild(div);
            });
            scrollLogs();
        }

        function scrollLogs() {
            if (autoScroll) {
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }
        }

        function toggleAllLogs() {
            document.querySelectorAll('.step-logs').forEach(el => {
                el.style.display = el.style.display === 'none' ? 'block' : 'none';
            });
        }

        function clearLogs() {
            logsContainer.innerHTML = '';
        }

        function formatTime(ts) {
            if (!ts) return '-';
            const d = new Date(ts * 1000);
            return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        connectWS();
        refreshSessions();
        refreshAutopilot();
        setInterval(refreshSessions, 10000);
        setInterval(refreshAutopilot, 10000);

        // Auto-scroll toggle
        document.getElementById('auto-scroll').addEventListener('change', (e) => {
            autoScroll = e.target.checked;
        });

        document.getElementById('session-filter').addEventListener('change', renderSessions);
    </script>
</body>
</html>
